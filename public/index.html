<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>imoveryou.io</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a19;--fg:#f3efe2;--hot:#ff5a3c;--dim:#9db3ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;cursor:crosshair;user-select:none}
canvas#c{position:fixed;inset:0;display:block}
.hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
.floor{font-weight:800;font-size:34px;line-height:1}
.pips{display:flex;gap:6px;margin-top:8px}
.pips i{width:22px;height:8px;border-radius:2px;background:rgba(243,239,226,.2)}
.pips i.on{background:var(--hot)}
.sub{margin-top:6px;font-size:13px;color:var(--dim)}
.lb{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));min-width:170px;font-size:13px;background:rgba(15,26,25,.55);border-radius:8px;padding:8px 12px;pointer-events:none}
.lb b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lb div{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.lb .me{color:var(--hot);font-weight:800}
.dash{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:200px;pointer-events:none;text-align:center;font-size:13px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:rgba(243,239,226,.18);margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;width:100%;background:var(--fg)}
.banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-weight:800;font-size:clamp(40px,9vw,96px);pointer-events:none;opacity:0}
.banner.go{animation:b 1.6s ease-out}
@keyframes b{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.menu,.shop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,26,25,.86);text-align:center;padding:24px;cursor:default}
.shop{z-index:8;justify-content:flex-start;overflow:auto;background:rgba(15,26,25,.96)}
.menu h1{font-size:clamp(44px,9vw,88px);margin:0;font-weight:800;letter-spacing:-.03em}
.menu h1 span{color:var(--hot)}
.menu p{margin:0;max-width:40ch;color:var(--dim);line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;font-size:20px;padding:12px 34px;border:0;border-radius:8px;background:var(--hot);color:#1a0b07;cursor:pointer}
button.alt{background:rgba(243,239,226,.16);color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#nm{font:inherit;font-size:18px;padding:10px 14px;border-radius:8px;border:0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(900px,100%)}
.card{background:rgba(243,239,226,.08);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.card button{font-size:14px;padding:7px 14px;width:100%}
.card small{color:var(--dim)}
.hide{display:none!important}
.devbtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 12px;background:rgba(243,239,226,.15);color:var(--fg);z-index:5}
.dev{position:fixed;left:12px;top:calc(130px + env(safe-area-inset-top,0px));width:290px;max-width:calc(100vw - 24px);max-height:calc(100% - 200px);overflow:auto;background:rgba(15,26,25,.94);border:1px solid rgba(243,239,226,.25);border-radius:10px;padding:12px 14px;font-size:13px;z-index:6;cursor:default}
.dev h2{margin:0 0 4px;font-size:16px}.dev h3{margin:14px 0 2px;font-size:13px;color:var(--hot);text-transform:uppercase;letter-spacing:.06em}
.dev label{display:block;margin:8px 0 2px;color:var(--dim)}.dev label span{float:right;color:var(--fg)}
.dev input[type=range]{width:100%}
.dev input[type=number]{width:64px;font:inherit;padding:4px;border-radius:4px;border:1px solid var(--dim);background:var(--bg);color:var(--fg)}
.dev button{font-size:13px;padding:6px 12px;margin:8px 6px 0 0}.dev small{display:block;margin-top:10px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.banner.go{animation:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="floor" id="fl">Floor 1</div><div class="pips" id="pips"></div><div class="sub" id="lv"></div><div class="sub" id="pt"></div></div>
<div class="lb" id="lb"></div>
<div class="dash"><div class="bar" style="margin:0 0 8px"><b id="pb" style="background:var(--hot);width:0"></b></div><span id="dt">Dash ready · Space</span><div class="bar"><b id="db"></b></div></div>
<div class="banner" id="bn"></div>
<button class="devbtn hide" id="devbtn">Test panel</button>
<div class="dev hide" id="dev"><h2>Test panel</h2></div>
<div class="menu" id="menu">
  <h1>imoveryou<span>.io</span></h1>
  <p id="mt"></p>
  <input id="nm" maxlength="12" placeholder="Your name">
  <div class="row"><button id="play">Play</button><button class="alt" id="shopbtn">Skins shop</button></div>
  <div class="sub" id="mpts"></div>
</div>
<div class="shop hide" id="shop">
  <h1 style="margin:0">Skins shop</h1><div class="sub" id="spts" style="font-size:18px"></div>
  <div class="grid" id="skins"></div><button class="alt" id="shopx">Back</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const A=2400,R=(a,b)=>a+Math.random()*(b-a);
let ws,authed=false,want=false,prof={points:0,owned:['classic'],skin:'classic'},my=0,floor=0,kills=-1,need=3,lives=5,pts=0,dcd=0,dm=1.6,cw=0;
let E=new Map(),AR=[],WL=[],arT=0,fx=[],shake=0,down=false,mouse={x:0,y:0},last=0,bt,lbKey='',SK={classic:{id:'classic',name:'Classic',price:0,style:{}}},SKL=[SK.classic];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{}};
let tok=ls('iov_token');if(!tok){tok=(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2)+'0123456789abcdef');ls('iov_token',tok)}
$('nm').value=ls('iov_name')||'';

// ---------- art hooks: any file below that exists in /assets is used instead of the sketch placeholder ----------
const IM={},PT={};
function img(p){let o=IM[p];if(!o){o=IM[p]={i:new Image(),ok:false};o.i.onload=()=>o.ok=true;o.i.src=p}return o.ok?o.i:null}
function pat(im,s){const k=im.src+s;if(!PT[k]){const p=g.createPattern(im,'repeat');p.setTransform(new DOMMatrix([s,0,0,s,0,0]));PT[k]=p}return PT[k]}
function spr(c,im,x,y,ang,w,h){c.save();c.translate(x,y);c.rotate(ang);c.drawImage(im,-w/2,-h/2,w,h);c.restore()}
function drawBody(c,x,y,rad,a,id,hue){          // skin sprite: assets/skins/<id>.png (256px, faces right, body circle = 56% of width)
  const im=img('assets/skins/'+id+'.png');if(im){spr(c,im,x,y,a,rad*3.56,rad*3.56);return}
  const st=(SK[id]&&SK[id].style)||{};c.save();c.globalAlpha*=st.alpha||1;
  c.fillStyle=st.fill||`hsl(${hue} 75% 55%)`;c.beginPath();c.arc(x,y,rad,0,6.28);c.fill();
  if(st.ring){c.strokeStyle=st.ring;c.lineWidth=rad*.3;c.beginPath();c.arc(x,y,rad*.55,0,6.28);c.stroke()}
  if(st.stripe){c.strokeStyle=st.stripe;c.lineWidth=rad*.35;c.beginPath();c.moveTo(x-rad*.7,y-rad*.7);c.lineTo(x+rad*.7,y+rad*.7);c.stroke()}
  c.restore();
}

// ---------- HUD / menus ----------
const pips=$('pips');
function setPips(){pips.textContent='';for(let i=0;i<need;i++)pips.appendChild(document.createElement('i'))}
function hud(){$('fl').textContent='Floor '+floor;$('lv').textContent='Lives: '+lives;$('pt').textContent='Points: '+pts;[...pips.children].forEach((p,i)=>p.classList.toggle('on',i<kills))}
function banner(t){const b=$('bn');clearTimeout(bt);b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go');bt=setTimeout(()=>b.classList.remove('go'),1600)}
function burst(x,y,h,n){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(80,380);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.3,.7),h})}}
function menuText(t){$('mt').textContent=t}
function showMenu(){$('menu').classList.remove('hide');$('mpts').textContent='Points: '+prof.points}
menuText('Move with your mouse. Hold click to draw your bow and release to fire: the longer the draw, the faster the arrow. Space to dash. Dash, then flick your aim and fire to curve an arrow. Earn points with kills and spend them in the shop.');
fetch('skins.json').then(r=>r.json()).then(j=>{SKL=j.skins;SK=Object.fromEntries(SKL.map(s=>[s.id,s]));renderShop()}).catch(()=>{});
function renderShop(){
  $('spts').textContent='Your points: '+prof.points;$('mpts').textContent='Points: '+prof.points;
  const box=$('skins');box.textContent='';
  for(const s of SKL){
    const owned=prof.owned.includes(s.id),eq=prof.skin===s.id,c=document.createElement('div');c.className='card';
    const cn=document.createElement('canvas');cn.width=cn.height=88;drawBody(cn.getContext('2d'),44,44,24,0,s.id,18);
    const nm=document.createElement('b');nm.textContent=s.name;
    const bt2=document.createElement('button');
    if(eq){bt2.textContent='Equipped';bt2.disabled=true}
    else if(owned){bt2.textContent='Equip';bt2.onclick=()=>send({t:'equip',id:s.id})}
    else{bt2.textContent='Buy · '+s.price;bt2.disabled=prof.points<s.price;bt2.onclick=()=>send({t:'buy',id:s.id})}
    c.append(cn,nm,bt2);box.appendChild(c);
  }
}
$('shopbtn').onclick=()=>{renderShop();$('shop').classList.remove('hide')};
$('shopx').onclick=()=>$('shop').classList.add('hide');

// ---------- networking ----------
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send({t:'auth',token:tok,key:new URLSearchParams(location.search).get('dev')||''});
  ws.onmessage=m=>{const s=JSON.parse(m.data);s.t==='prof'?onProf(s):s.t==='bd'?onBd(s.v):s.t==='over'?over(s):snap(s)};
  ws.onclose=()=>{authed=false;my=0;menuText('Disconnected from the server. Press Play to reconnect.');showMenu()};
}
function startGame(){
  ls('iov_name',$('nm').value);
  if(authed)join();else{want=true;if(!ws||ws.readyState>1)connect()}
}
function join(){send({t:'join',name:$('nm').value||'player'});$('menu').classList.add('hide');$('shop').classList.add('hide')}
function onProf(s){prof=s;authed=true;renderShop();if(s.dev)buildDev();if(want){want=false;join()}}
function over(s){
  my=0;floor=0;kills=-1;E.clear();AR=[];WL=[];g.fillStyle='#0f1a19';g.fillRect(0,0,W,H);
  menuText('Out of lives after '+s.lives+' knockouts. Best floor: '+s.best+' · Kills: '+s.tk+'. Spend your points in the shop, then play again.');
  $('play').textContent='Play again';showMenu();
}
function snap(s){
  my=s.id;
  if(s.fl!==floor){if(floor)banner(s.fl>floor?'Floor '+s.fl:'Back to floor '+s.fl);floor=s.fl;E.clear()}
  if(s.nd!==need||!pips.children.length){need=s.nd;setPips()}
  kills=s.k;lives=s.lv;pts=s.pt;prof.points=s.pt;hud();dcd=s.dcd;dm=s.dm;cw=s.cw;
  const k=JSON.stringify(s.lb);if(k!==lbKey){lbKey=k;const L=$('lb');L.textContent='';const t=document.createElement('b');t.textContent='Top players';L.appendChild(t);
    for(const r of s.lb){const d=document.createElement('div');if(r[0]===my)d.className='me';const a=document.createElement('span'),b=document.createElement('span');a.textContent=r[1];b.textContent=r[2]+' kills · F'+r[3];d.append(a,b);L.appendChild(d)}}
  const seen=new Set();
  for(const q of s.p){seen.add(q[0]);let e=E.get(q[0]);if(!e){e={x:q[1],y:q[2]};E.set(q[0],e)}
    Object.assign(e,{tx:q[1],ty:q[2],a:q[3],hp:q[4],hue:q[5],dash:q[6],name:q[7],ch:q[8],bot:q[9],skin:q[10]})}
  for(const k2 of E.keys())if(!seen.has(k2))E.delete(k2);
  AR=s.a;WL=s.w||[];arT=performance.now();
  for(const v of s.e){burst(v[0],v[1],v[2],v[3]===1?26:v[3]===2?4:6);if(v[3]===1&&v[4]===my)shake=8}
}

// ---------- drawing ----------
function draw(dt){
  const me=E.get(my);if(!me)return;
  const k=1-Math.exp(-dt*20);for(const e of E.values()){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  const hue=(floor*57+160)%360,fi=img('assets/floor_'+floor+'.png')||img('assets/floor.png');
  g.fillStyle=`hsl(${hue} 38% 17%)`;g.fillRect(0,0,W,H);
  g.save();g.translate(W/2-me.x+(shake?R(-shake,shake):0),H/2-me.y+(shake?R(-shake,shake):0));
  g.fillStyle=fi?pat(fi,.5):`hsl(${hue} 34% 23%)`;g.fillRect(0,0,A,A);
  if(!fi){g.strokeStyle=`hsl(${hue} 30% 30%)`;g.lineWidth=1;g.beginPath();
    const x0=Math.max(0,Math.floor((me.x-W/2)/100)*100),x1=Math.min(A,me.x+W/2),y0=Math.max(0,Math.floor((me.y-H/2)/100)*100),y1=Math.min(A,me.y+H/2);
    for(let x=x0;x<=x1;x+=100){g.moveTo(x,y0);g.lineTo(x,y1)}for(let y=y0;y<=y1;y+=100){g.moveTo(x0,y);g.lineTo(x1,y)}g.stroke()}
  g.strokeStyle='#f3efe2';g.lineWidth=6;g.strokeRect(0,0,A,A);
  const wi=img('assets/wall.png'),pi=img('assets/pillar.png')||wi;
  for(const q of WL){const im=q[2]===80&&q[3]===80?pi:wi;
    if(im){g.save();g.translate(q[0],q[1]);g.fillStyle=pat(im,.5);g.fillRect(0,0,q[2],q[3]);g.restore()}
    else{g.fillStyle='rgba(0,0,0,.35)';g.fillRect(q[0]+4,q[1]+6,q[2],q[3]);g.fillStyle=`hsl(${hue} 22% 62%)`;g.fillRect(q[0],q[1],q[2],q[3]);g.strokeStyle='#f3efe2';g.lineWidth=3;g.strokeRect(q[0],q[1],q[2],q[3])}}
  g.lineCap='round';
  const da=(performance.now()-arT)/1000;
  for(const a of AR){const x=a[0]+a[2]*da,y=a[1]+a[3]*da,im=img(a[5]?'assets/arrow_curve.png':'assets/arrow.png')||img('assets/arrow.png');
    if(im)spr(g,im,x,y,Math.atan2(a[3],a[2]),40,16);
    else{g.strokeStyle=a[5]?'#ff9a3c':a[4]===my?'#fff':'#ffd9a0';g.lineWidth=a[5]?5:3;g.beginPath();g.moveTo(x,y);g.lineTo(x-a[2]*.025,y-a[3]*.025);g.stroke()}}
  for(const [id,e] of E){
    g.globalAlpha=e.dash?.35:1;drawBody(g,e.x,e.y,18,e.a,e.skin||'classic',e.hue);g.globalAlpha=1;
    if(id===my){g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,18,0,6.28);g.stroke()}
    const bw=img('assets/bow_'+(e.ch>0?(e.ch<.5?1:2):0)+'.png');
    if(bw)spr(g,bw,e.x,e.y,e.a,64,64);
    else{g.strokeStyle='#f3efe2';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,26,e.a-.9,e.a+.9);g.stroke();
      if(e.ch>0){const c=Math.cos(e.a),n=Math.sin(e.a),t0=6-10*e.ch,t1=40-14*e.ch;g.strokeStyle='#ffd9a0';g.lineWidth=3;g.beginPath();g.moveTo(e.x+c*t0,e.y+n*t0);g.lineTo(e.x+c*t1,e.y+n*t1);g.stroke();
        g.strokeStyle='#ff5a3c';g.lineWidth=4;g.beginPath();g.arc(e.x,e.y,32,e.a-.9,e.a-.9+1.8*e.ch);g.stroke()}}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(e.x-20,e.y-34,40,5);g.fillStyle=e.hp>50?'#8be28b':'#ff7a5c';g.fillRect(e.x-20,e.y-34,40*Math.max(0,e.hp)/100,5);
    g.fillStyle=e.bot?'#9db3ad':'#f3efe2';g.font='600 12px system-ui,sans-serif';g.textAlign='center';g.fillText(e.name,e.x,e.y-40);
  }
  for(const p of fx){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=`hsl(${p.h} 80% 62%)`;g.fillRect(p.x-2,p.y-2,4,4)}
  g.globalAlpha=1;g.restore();
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}fx=fx.filter(p=>p.l>0);shake=Math.max(0,shake-dt*30);
  $('db').style.width=((dm>0?Math.max(0,1-dcd/dm):1)*100)+'%';{const m=E.get(my);$('pb').style.width=((m&&m.ch||0)*100)+'%'}
  $('dt').textContent=cw>0?'Curve window: flick and fire!':dcd>0?'Dash recharging':'Dash ready · Space';
  draw(dt);requestAnimationFrame(loop);
}
setInterval(()=>{if(my){const dx=mouse.x-W/2,dy=mouse.y-H/2;send({t:'in',a:Math.atan2(dy,dx),d:Math.hypot(dx,dy),f:down})}},33);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('pointerdown',e=>{if(e.target.closest('#menu,#shop,#dev,#devbtn'))return;mouse.x=e.clientX;mouse.y=e.clientY;down=true});
addEventListener('pointerup',()=>down=false);
addEventListener('keydown',e=>{
  if(e.code==='Backquote'&&!$('devbtn').classList.contains('hide')){e.preventDefault();$('dev').classList.toggle('hide');return}
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='nm')startGame();return}
  if(e.code==='Space'){e.preventDefault();if(my)send({t:'dash'})}});

// ---------- test panel (only with ?dev=KEY) ----------
// [key,label,min,max,step,default]  - these apply to YOU only
const PCFG=[['maxCharge','Max draw time (s)',.1,5,.1,.4],['rec','Recovery after a shot (s)',0,2,.05,.25],['minSpd','Slowest arrow (px/s)',100,2000,50,400],['maxSpd','Fastest arrow (px/s)',200,3000,50,1400],
 ['arrowLife','Arrow flight time (s)',.2,3,.1,.9],['arrowDmg','Arrow damage (100 = one-shot)',1,200,1,34],['bounceK','Speed kept per wall bounce',0,1.2,.05,1],
 ['speed','Player speed',100,900,10,290],['dashCd','Dash cooldown (s)',0,5,.1,1.6],['dashSpd','Dash speed',300,4000,50,1500],['dashTime','Dash duration (s)',.05,.6,.01,.14],
 ['curveWin','Curve window after dash (s)',0,3,.1,1],['curveK','Curve strength x',0,3,.1,1],['need','Kills to climb a floor',1,20,1,3],['lives','Lives (knockouts allowed)',1,20,1,5]];
// bot difficulty: server-wide
const BCFG=[['aimErr','Aim error (rad, higher = easier)',0,1.5,.02],['reload','Time between shots (s)',.25,4,.05],['speed','Move speed',40,300,5],['sight','Sight range',200,900,10],['dash','Dash chance when hurt',0,1,.05],['dmg','Damage multiplier',.1,1.5,.05],['floorScale','Harder per floor x',0,2,.05]];
let devBuilt=false,brows={},pendingBd=null;
function onBd(v){pendingBd=v;for(const k in brows){brows[k][0].value=v[k];brows[k][1].textContent=v[k]}}
function buildDev(){
  if(devBuilt)return;devBuilt=true;$('devbtn').classList.remove('hide');const dev=$('dev'),prows=[];
  const h3=t=>{const h=document.createElement('h3');h.textContent=t;dev.append(h)};
  const slider=(label,min,max,step,val,fn)=>{const l=document.createElement('label'),v=document.createElement('span');v.textContent=val;l.append(label,v);
    const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.oninput=()=>{v.textContent=i.value;fn(+i.value)};dev.append(l,i);return[i,v]};
  const btn=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>fn(b);dev.append(b);return b};
  h3('You');for(const [k,l,mn,mx,st,d] of PCFG)prows.push([k,d,...slider(l,mn,mx,st,d,v=>send({t:'cfg',k,v}))]);
  let god=false,self=true;
  btn('God mode: off',b=>{god=!god;b.textContent='God mode: '+(god?'on':'off');send({t:'cfg',k:'god',v:god})});
  btn('Own bounced arrows hurt: on',b=>{self=!self;b.textContent='Own bounced arrows hurt: '+(self?'on':'off');send({t:'cfg',k:'selfHit',v:self})});
  btn('Reset my settings',()=>{for(const [k,d,i,v] of prows){i.value=d;v.textContent=d;send({t:'cfg',k,v:d})}send({t:'cfg',k:'god',v:false});send({t:'cfg',k:'selfHit',v:true})});
  h3('Bots');slider('Bots on this floor (-1 = auto)',-1,40,1,-1,v=>send({t:'bots',v}));
  for(const p of ['easy','normal','hard'])btn(p[0].toUpperCase()+p.slice(1),()=>send({t:'bdpreset',v:p}));
  for(const [k,l,mn,mx,st] of BCFG)brows[k]=slider(l,mn,mx,st,mn,v=>send({t:'bd',k,v}));
  if(pendingBd)onBd(pendingBd);
  h3('Floor');const gl=document.createElement('label');gl.textContent='Go to floor ';const fi=document.createElement('input');fi.type='number';fi.min=1;fi.max=99;fi.value=1;
  const gb=document.createElement('button');gb.textContent='Go';gb.onclick=()=>send({t:'floor',v:+fi.value||1});gl.append(fi,gb);dev.append(gl);
  const sm=document.createElement('small');sm.textContent='Your settings affect you only. Bot difficulty affects everyone on the server. Press ` to open or close.';dev.append(sm);
}
$('devbtn').onclick=()=>$('dev').classList.toggle('hide');
$('play').onclick=startGame;
connect();requestAnimationFrame(loop);
</script>
</body></html>
