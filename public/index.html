<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>imoveryou.io</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a19;--fg:#f3efe2;--hot:#ff5a3c;--dim:#9db3ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a19;--fg:#f3efe2}}
:root[data-theme="dark"]{--bg:#0f1a19;--fg:#f3efe2}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;cursor:crosshair;user-select:none}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
.floor{font-weight:800;font-size:34px;line-height:1}
.pips{display:flex;gap:6px;margin-top:8px}
.pips i{width:22px;height:8px;border-radius:2px;background:rgba(243,239,226,.2)}
.pips i.on{background:var(--hot)}
.dash{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:200px;pointer-events:none;text-align:center;font-size:13px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:rgba(243,239,226,.18);margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;width:100%;background:var(--fg)}
.banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-weight:800;font-size:clamp(40px,9vw,96px);pointer-events:none;opacity:0}
.banner.go{animation:b 1.6s ease-out}
@keyframes b{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,26,25,.82);text-align:center;padding:24px}
.menu h1{font-size:clamp(44px,9vw,88px);margin:0;font-weight:800;letter-spacing:-.03em}
.menu h1 span{color:var(--hot)}
.menu p{margin:0;max-width:34ch;color:var(--dim);line-height:1.45}
button{font:inherit;font-weight:800;font-size:20px;padding:12px 34px;border:0;border-radius:8px;background:var(--hot);color:#1a0b07;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.hide{display:none}
.devbtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 12px;background:rgba(243,239,226,.15);color:var(--fg);z-index:5}
.dev{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:270px;max-width:calc(100vw - 24px);max-height:calc(100% - 70px);overflow:auto;background:rgba(15,26,25,.94);border:1px solid rgba(243,239,226,.25);border-radius:10px;padding:12px 14px;font-size:13px;z-index:6;cursor:default}
.dev h2{margin:0 0 8px;font-size:16px}
.dev label{display:block;margin:8px 0 2px;color:var(--dim)}
.dev label span{float:right;color:var(--fg)}
.dev input[type=range]{width:100%}
.dev input[type=number]{width:64px;font:inherit;padding:4px;border-radius:4px;border:1px solid var(--dim);background:var(--bg);color:var(--fg)}
.dev button{font-size:13px;padding:6px 12px;margin:8px 6px 0 0}
.dev small{display:block;margin-top:10px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.banner.go{animation:none;opacity:1}}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="floor" id="fl">Floor 1</div><div class="pips" id="pips"></div></div>
<div class="dash"><div class="bar" style="margin:0 0 8px"><b id="pb" style="background:var(--hot);width:0"></b></div><span id="dt">Dash ready · Space</span><div class="bar"><b id="db"></b></div></div>
<div class="banner" id="bn"></div>
<button class="devbtn hide" id="devbtn">Test panel</button>
<div class="dev hide" id="dev"><h2>Test panel</h2></div>
<div class="menu" id="menu">
  <h1>imoveryou<span>.io</span></h1>
  <p id="mt">Move with your mouse. Hold click to shoot. Space to dash. Get 5 kills to climb to the next floor.</p>
  <input id="nm" maxlength="12" placeholder="Your name" style="font:inherit;font-size:18px;padding:10px 14px;border-radius:8px;border:0;text-align:center"><button id="play">Play</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const A=2400,NEED=5,R=(a,b)=>a+Math.random()*(b-a);
let WL=[],dm=1.6,ws,my=0,floor=0,kills=-1,dcd=0,E=new Map(),AR=[],arT=0,fx=[],shake=0,down=false,mouse={x:0,y:0},last=0,bt;
const pips=$('pips');for(let i=0;i<NEED;i++)pips.appendChild(document.createElement('i'));
function hud(){$('fl').textContent='Floor '+floor;[...pips.children].forEach((p,i)=>p.classList.toggle('on',i<kills))}
function banner(t){const b=$('bn');clearTimeout(bt);b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go');bt=setTimeout(()=>b.classList.remove('go'),1600)}
function burst(x,y,h,n){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(80,380);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.3,.7),h})}}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{ws.send(JSON.stringify({t:'join',name:$('nm').value||'player',key:new URLSearchParams(location.search).get('dev')||''}));$('menu').classList.add('hide')};
  ws.onmessage=m=>{const s=JSON.parse(m.data);s.t==='hello'?hello(s):snap(s)};
  ws.onclose=()=>{my=0;$('mt').textContent='Disconnected from the server.';$('play').textContent='Reconnect';$('menu').classList.remove('hide')};
}
function snap(s){
  my=s.id;
  if(s.fl!==floor){if(floor)banner(s.fl>floor?'Floor '+s.fl:'Back to floor '+s.fl);floor=s.fl;E.clear()}
  if(s.k!==kills||s.fl!==floor){kills=s.k}
  hud();dcd=s.dcd;dm=s.dm;
  const seen=new Set();
  for(const q of s.p){
    seen.add(q[0]);let e=E.get(q[0]);if(!e){e={x:q[1],y:q[2]};E.set(q[0],e)}
    Object.assign(e,{tx:q[1],ty:q[2],a:q[3],hp:q[4],hue:q[5],dash:q[6],name:q[7],ch:q[8],bot:q[9]});
  }
  for(const k of E.keys())if(!seen.has(k))E.delete(k);
  AR=s.a;WL=s.w||[];arT=performance.now();
  for(const v of s.e){burst(v[0],v[1],v[2],v[3]===1?26:v[3]===2?4:6);if(v[3]===1&&v[4]===my)shake=8}
}
function draw(dt){
  const me=E.get(my);if(!me)return;
  const k=1-Math.exp(-dt*20);for(const e of E.values()){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  const hue=(floor*57+160)%360;
  g.fillStyle=`hsl(${hue} 38% 17%)`;g.fillRect(0,0,W,H);
  g.save();g.translate(W/2-me.x+(shake?R(-shake,shake):0),H/2-me.y+(shake?R(-shake,shake):0));
  g.fillStyle=`hsl(${hue} 34% 23%)`;g.fillRect(0,0,A,A);
  g.strokeStyle=`hsl(${hue} 30% 30%)`;g.lineWidth=1;g.beginPath();
  const x0=Math.max(0,Math.floor((me.x-W/2)/100)*100),x1=Math.min(A,me.x+W/2),y0=Math.max(0,Math.floor((me.y-H/2)/100)*100),y1=Math.min(A,me.y+H/2);
  for(let x=x0;x<=x1;x+=100){g.moveTo(x,y0);g.lineTo(x,y1)}for(let y=y0;y<=y1;y+=100){g.moveTo(x0,y);g.lineTo(x1,y)}
  g.stroke();g.strokeStyle='#f3efe2';g.lineWidth=6;g.strokeRect(0,0,A,A);
  for(const q of WL){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(q[0]+4,q[1]+6,q[2],q[3]);g.fillStyle=`hsl(${hue} 22% 62%)`;g.fillRect(q[0],q[1],q[2],q[3]);g.strokeStyle='#f3efe2';g.lineWidth=3;g.strokeRect(q[0],q[1],q[2],q[3])}
  g.lineCap='round';
  const da=(performance.now()-arT)/1000;
  for(const a of AR){const x=a[0]+a[2]*da,y=a[1]+a[3]*da;g.strokeStyle=a[4]===my?'#fff':'#ffd9a0';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x-a[2]*.025,y-a[3]*.025);g.stroke()}
  for(const [id,e] of E){
    if(e.dash){g.globalAlpha=.35}
    g.fillStyle=`hsl(${e.hue} 75% 55%)`;g.beginPath();g.arc(e.x,e.y,18,0,6.28);g.fill();g.globalAlpha=1;
    if(id===my){g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
    g.strokeStyle='#f3efe2';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,26,e.a-.9,e.a+.9);g.stroke();
    if(e.ch>0){const c=Math.cos(e.a),n=Math.sin(e.a),t0=6-10*e.ch,t1=40-14*e.ch;g.strokeStyle='#ffd9a0';g.lineWidth=3;g.beginPath();g.moveTo(e.x+c*t0,e.y+n*t0);g.lineTo(e.x+c*t1,e.y+n*t1);g.stroke();g.strokeStyle='#ff5a3c';g.lineWidth=4;g.beginPath();g.arc(e.x,e.y,32,e.a-.9,e.a-.9+1.8*e.ch);g.stroke()}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(e.x-20,e.y-34,40,5);g.fillStyle=e.hp>50?'#8be28b':'#ff7a5c';g.fillRect(e.x-20,e.y-34,40*Math.max(0,e.hp)/100,5);
    g.fillStyle=e.bot?'#9db3ad':'#f3efe2';g.font='600 12px system-ui,sans-serif';g.textAlign='center';g.fillText(e.name,e.x,e.y-40);
  }
  for(const p of fx){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=`hsl(${p.h} 80% 62%)`;g.fillRect(p.x-2,p.y-2,4,4)}
  g.globalAlpha=1;g.restore();
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}fx=fx.filter(p=>p.l>0);shake=Math.max(0,shake-dt*30);
  $('db').style.width=((dm>0?Math.max(0,1-dcd/dm):1)*100)+'%';{const m=E.get(my);$('pb').style.width=((m&&m.ch||0)*100)+'%'}$('dt').textContent=dcd>0?'Dash recharging':'Dash ready · Space';
  draw(dt);requestAnimationFrame(loop);
}
setInterval(()=>{if(ws&&ws.readyState===1&&my){const dx=mouse.x-W/2,dy=mouse.y-H/2;ws.send(JSON.stringify({t:'in',a:Math.atan2(dy,dx),d:Math.hypot(dx,dy),f:down}))}},33);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('pointerdown',e=>{if(e.target.closest('#menu,#dev,#devbtn'))return;mouse.x=e.clientX;mouse.y=e.clientY;down=true});
addEventListener('pointerup',()=>down=false);
addEventListener('keydown',e=>{if(e.code==='Backquote'&&!$('devbtn').classList.contains('hide')){e.preventDefault();$('dev').classList.toggle('hide');return}
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='nm')connect();return}if(e.code==='Space'){e.preventDefault();if(ws&&ws.readyState===1)ws.send('{"t":"dash"}')}});
$('mt').textContent='Move with your mouse. Hold click to draw your bow and release to fire: the longer the draw, the faster the arrow. Space to dash. Get 5 kills to climb; get knocked out and you drop a floor.';
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const DEF={maxCharge:2,minSpd:400,maxSpd:1400,speed:290,dashCd:1.6};
function hello(s){if(!s.dev)return;$('devbtn').classList.remove('hide');if($('dev').childElementCount<2)buildDev()}
function buildDev(){
  const dev=$('dev'),rows=[];
  const row=(label,min,max,step,val,fn)=>{const l=document.createElement('label'),v=document.createElement('span');v.textContent=val;l.append(label,v);
    const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.oninput=()=>{v.textContent=i.value;fn(+i.value)};dev.append(l,i);return [i,v]};
  for(const [k,label,min,max,step] of [['maxCharge','Max draw time (s)',.2,5,.1],['minSpd','Slowest arrow (px/s)',100,2000,50],['maxSpd','Fastest arrow (px/s)',200,3000,50],['speed','Player speed',100,900,10],['dashCd','Dash cooldown (s)',0,5,.1]])
    rows.push([k,...row(label,min,max,step,DEF[k],v=>send({t:'cfg',k,v}))]);
  row('Bots on this floor (-1 = auto)',-1,40,1,-1,v=>send({t:'bots',v}));
  const gl=document.createElement('label');gl.textContent='Go to floor ';
  const fi=document.createElement('input');fi.type='number';fi.min=1;fi.max=99;fi.value=1;
  const gb=document.createElement('button');gb.textContent='Go';gb.onclick=()=>send({t:'floor',v:+fi.value||1});gl.append(fi,gb);dev.append(gl);
  let god=false;const gd=document.createElement('button');gd.textContent='God mode: off';
  gd.onclick=()=>{god=!god;gd.textContent='God mode: '+(god?'on':'off');send({t:'cfg',k:'god',v:god})};
  const rs=document.createElement('button');rs.textContent='Reset defaults';
  rs.onclick=()=>{for(const [k,i,v] of rows){i.value=DEF[k];v.textContent=DEF[k];send({t:'cfg',k,v:DEF[k]})}god=false;gd.textContent='God mode: off';send({t:'cfg',k:'god',v:false})};
  dev.append(gd,rs);
  const sm=document.createElement('small');sm.textContent='Changes apply to you only. Press ` to open or close.';dev.append(sm);
}
$('devbtn').onclick=()=>$('dev').classList.toggle('hide');
$('play').onclick=connect;
requestAnimationFrame(loop);
</script>
</body></html>
